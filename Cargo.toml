[workspace]
resolver = "3"
members = ["crates/forge-sdk", "crates/forge-primitives", "crates/forge-dictate", "crates/forge-providers", "crates/forge-connectors", "crates/forge-agent", "crates/forge-workspace", "crates/forge-tui", "crates/forge-test-harness"]

[workspace.package]
version = "1.0.39"
edition = "2024"
license = "MIT"
repository = "https://github.com/busytools/forge"
authors = ["Vedhavyas Singareddi <7549475+vedhavyas@users.noreply.github.com>"]
rust-version = "1.88"

[workspace.dependencies]
tokio = { version = "1.42", features = ["rt-multi-thread", "process", "io-util", "macros", "sync", "time", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tracing = "0.1"
anyhow = "1"
async-trait = "0.1"
getrandom = "0.3"
hex = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["parsing", "formatting"] }
time-tz = "2"
iana-time-zone = "0.1"
unicode-normalization = "0.1"
regex = "1"
parking_lot = "0.12"
httpdate = "1.0"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
toml = "0.8"
dirs = "6"
# Pinned exactly, not caret. ratatui-core 0.1.2 moved a blocking cursor
# read into `Terminal::clear`, which a caret range let an unlocked
# `cargo install` pick up and ship a crash with. The pin stops that for
# this one crate only; the startup provenance warning is what
# generalises, so do not read this as the safety net.
ratatui = { version = "=0.30.0", features = ["unstable-rendered-line-info"] }
crossterm = "0.29"
image = { version = "0.25", default-features = false, features = ["png"] }
hound = "3.5"

# Tier A primitives lifted from claude-code-rust
ansi-to-tui = "8"
ignore = "0.4"
notify = "8"
notify-rust = "4"
pulldown-cmark = "0.13"
similar = "3"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
tui-markdown = "=0.3.7"
tui-textarea = { package = "tui-textarea-2", version = "0.10" }
unicode-segmentation = "1.12"
unicode-width = "0.2"
base64 = "0.22"
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
futures = "0.3.31"
arboard = { version = "3.6.1", features = ["image-data"] }
which = "8.0.2"
rlimit = "0.10"
# Default features carry openmp, which has no system library to link
# against on a stock macOS toolchain.
llama-cpp-2 = { version = "0.1.154", default-features = false }
# llama-cpp-2's current detokenizer takes a caller-owned decoder so it can
# be held across tokens; the crate depends on encoding_rs but re-exports
# nothing.
encoding_rs = "0.8.35"
# Cross-process advisory file lock (flock) for the single-instance boot
# guard: forge refuses a second instance on the same config dir.
rustix = { version = "1", features = ["fs"] }
# 5-field cron-expression parsing + next-fire computation. chrono is
# croner's datetime dep; forge keeps it walled off inside the cron
# schedule module's next-fire fn (SystemTime everywhere else).
croner = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Gotify inbound integration: redb is the machine-local embedded store
# for durable subscriptions; tokio-tungstenite streams the Gotify
# server's notification WebSocket. rustls-tls-native-roots trusts the OS
# trust store so a Gotify behind an internal / local-CA cert (trusted by
# the system, curl, and reqwest) connects; the Mozilla webpki bundle
# would reject it.
redb = "2.6"
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }

# Local speech recognition (ggml-backed) and microphone capture for
# forge-dictate. `metal` is opted into per-target by the crate.
transcribe-cpp = "0.2.2"
cpal = "0.18"

# Workspace-internal crates
forge-primitives = { path = "crates/forge-primitives", version = "=1.0.39" }
forge-providers = { path = "crates/forge-providers", version = "=1.0.39" }
forge-connectors = { path = "crates/forge-connectors", version = "=1.0.39" }
forge-sdk = { path = "crates/forge-sdk", version = "=1.0.39" }
forge-agent = { path = "crates/forge-agent", version = "=1.0.39" }
forge-dictate = { path = "crates/forge-dictate", version = "=1.0.39" }
forge-workspace = { path = "crates/forge-workspace", version = "=1.0.39" }

# Dev-only
pretty_assertions = "1"
tempfile = "3"
# Snapshot testing for the replay-driven render-test harness (#280).
# `.snap` files committed to git; updates via `cargo insta review`.
insta = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
dead_code = "deny"
unused_imports = "deny"
unused_must_use = "deny"
unused_variables = "deny"
# Nothing here is published, so there is no docs.rs target and no
# public API contract to document against.
missing_docs = "allow"
# `unused_crate_dependencies` fires false positives at the build-target
# level (integration tests + examples don't import every workspace dep
# the lib does). Adopt per-lib.rs / per-main.rs via `#![deny(...)]` if
# needed; out of scope for the workspace-wide lint table.

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
exit = "deny"
todo = "deny"
unimplemented = "deny"
# Pedantic exemptions, each with its reason inline.
module_name_repetitions = "allow"   # Rust-idiomatic; not actually repetition.
must_use_candidate = "allow"        # Most fns don't need the marker.
return_self_not_must_use = "allow"  # Pair with must_use_candidate; builder
                                    # setters returning Self don't need it.
missing_errors_doc = "allow"        # thiserror covers public-error docs.
missing_panics_doc = "allow"        # `panic` is denied above; noise is minimal.
doc_markdown = "allow"              # Bare crate paths in prose are fine.
too_many_lines = "allow"            # Translators + dispatchers naturally large.
unnecessary_wraps = "allow"         # Symmetry across translate-fn returns.
struct_field_names = "allow"        # Wire-shape structs share prefixes by API contract.
struct_excessive_bools = "allow"    # Many UI state structs are flag bags by nature
                                    # (Cli flags, RenderState, SpinnerState, etc.).
# CLI surface (forge-tui binary) legitimately prints to stdout/stderr.
print_stdout = "allow"
print_stderr = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
