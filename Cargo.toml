[workspace]
resolver = "3"
members = ["crates/forge-sdk", "crates/forge-primitives", "crates/forge-agent", "crates/forge-workspace", "crates/forge-tui", "crates/forge-test-harness"]

[workspace.package]
version = "0.15.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/busytools/forge"
authors = ["Vedhavyas Singareddi <ved@subspace.network>"]
rust-version = "1.88"

[workspace.dependencies]
tokio = { version = "1.42", features = ["rt-multi-thread", "process", "io-util", "macros", "sync", "time", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tracing = "0.1"
anyhow = "1"
async-trait = "0.1"
getrandom = "0.3"
hex = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["parsing", "formatting"] }
unicode-normalization = "0.1"
tokio-stream = "0.1"
regex = "1"
parking_lot = "0.12"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
toml = "0.8"
dirs = "6"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
crossterm = "0.29"

# Tier A primitives lifted from claude-code-rust
ansi-to-tui = "8"
ignore = "0.4"
notify = "8"
notify-rust = "4"
pulldown-cmark = "0.13"
similar = "3"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
tui-markdown = "=0.3.7"
tui-textarea = { package = "tui-textarea-2", version = "0.10" }
unicode-segmentation = "1.12"
unicode-width = "0.2"
base64 = "0.22"
sysinfo = { version = "0.32", default-features = false, features = ["system"] }

# Workspace-internal crates
forge-primitives = { path = "crates/forge-primitives", version = "=0.15.1" }
forge-agent = { path = "crates/forge-agent", version = "=0.15.1" }
forge-workspace = { path = "crates/forge-workspace", version = "=0.15.1" }

# Dev-only
proptest = "1"
insta = { version = "1", features = ["yaml"] }
pretty_assertions = "1"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
dead_code = "deny"
unused_imports = "deny"
unused_must_use = "deny"
unused_variables = "deny"
# Personal-use scope — no docs.rs publishing target, no public API contract.
missing_docs = "allow"
# `unused_crate_dependencies` fires false positives at the build-target
# level (integration tests + examples don't import every workspace dep
# the lib does). Adopt per-lib.rs / per-main.rs via `#![deny(...)]` if
# needed; out of scope for the workspace-wide lint table.

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
exit = "deny"
todo = "deny"
unimplemented = "deny"
# Pedantic exemptions: not load-bearing for personal-use scope.
module_name_repetitions = "allow"   # Rust-idiomatic; not actually repetition.
must_use_candidate = "allow"        # Most fns don't need the marker.
missing_errors_doc = "allow"        # thiserror covers public-error docs.
missing_panics_doc = "allow"        # `panic` is denied above; noise is minimal.
doc_markdown = "allow"              # Bare crate paths in prose are fine.
too_many_lines = "allow"            # Translators + dispatchers naturally large.
unnecessary_wraps = "allow"         # Symmetry across translate-fn returns.
struct_field_names = "allow"        # Wire-shape structs share prefixes by API contract.
# CLI surface (forge-tui binary) legitimately prints to stdout/stderr.
print_stdout = "allow"
print_stderr = "allow"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
