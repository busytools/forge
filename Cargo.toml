[workspace]
resolver = "3"
members = ["crates/forge-sdk", "crates/forge-conformance", "crates/forged", "crates/forge-tui", "crates/forged-conformance"]

[workspace.package]
version = "0.1.64"
edition = "2024"
license = "MIT"
repository = "https://github.com/busytools/forge"
authors = ["Vedhavyas Singareddi <dev@example.com>"]
rust-version = "1.85"

[workspace.dependencies]
tokio = { version = "1.42", features = ["rt-multi-thread", "process", "io-util", "macros", "sync", "time", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tracing = "0.1"
anyhow = "1"
async-trait = "0.1"
getrandom = "0.3"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
unicode-normalization = "0.1"
tokio-stream = "0.1"
regex = "1"
parking_lot = "0.12"
tokio-tungstenite = "0.24"
clap = { version = "4", features = ["derive"] }
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
toml = "0.8"
ratatui = "0.29"
crossterm = "0.28"

# Dev-only
proptest = "1"
insta = { version = "1", features = ["yaml"] }
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
exit = "deny"
todo = "deny"
unimplemented = "deny"
module_name_repetitions = "allow"   # Rust-idiomatic pattern; not actually repetition

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
