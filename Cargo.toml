[workspace]
resolver = "3"
members = ["crates/forge-sdk", "crates/forge-primitives", "crates/forge-agent", "crates/forge-tui", "crates/forge-test-harness"]

[workspace.package]
version = "0.1.64"
edition = "2024"
license = "MIT"
repository = "https://github.com/busytools/forge"
authors = ["Vedhavyas Singareddi <dev@example.com>"]
rust-version = "1.88"

[workspace.dependencies]
tokio = { version = "1.42", features = ["rt-multi-thread", "process", "io-util", "macros", "sync", "time", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tracing = "0.1"
anyhow = "1"
async-trait = "0.1"
getrandom = "0.3"
hex = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["parsing", "formatting"] }
unicode-normalization = "0.1"
tokio-stream = "0.1"
regex = "1"
parking_lot = "0.12"
futures-util = "0.3"
clap = { version = "4", features = ["derive"] }
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
toml = "0.8"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
crossterm = "0.29"

# Tier A primitives lifted from claude-code-rust
ansi-to-tui = "8"
ignore = "0.4"
notify = "8"
notify-rust = "4"
pulldown-cmark = "0.13"
similar = "3"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
tui-markdown = "=0.3.7"
tui-textarea = { package = "tui-textarea-2", version = "0.10" }
unicode-segmentation = "1.12"
unicode-width = "0.2"
base64 = "0.22"

# Workspace-internal crates
forge-primitives = { path = "crates/forge-primitives", version = "=0.1.64" }
forge-agent = { path = "crates/forge-agent", version = "=0.1.64" }

# Dev-only
proptest = "1"
insta = { version = "1", features = ["yaml"] }
pretty_assertions = "1"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
exit = "deny"
todo = "deny"
unimplemented = "deny"
module_name_repetitions = "allow"   # Rust-idiomatic pattern; not actually repetition

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
