[graph]
targets = [
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-unknown-linux-gnu" },
]

[advisories]
version = 2
yanked = "deny"
ignore = [
    # `yaml-rust 0.4.5` is unmaintained but ships transitively through
    # `syntect 5.3.0` (-> tui-markdown, forge-tui). syntect hasn't
    # cut a release that switches to `yaml-rust2` yet; ignore until
    # an upstream upgrade lands.
    { id = "RUSTSEC-2024-0320", reason = "yaml-rust unmaintained, pinned via syntect; awaits upstream cut to yaml-rust2" },
    # `bincode 1.3.3` is unmaintained (the maintainer ceased
    # development); reachable only via syntect → forge-tui /
    # tui-markdown. No security impact, just no upstream bumps.
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.3.3 unmaintained, pinned via syntect" },
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace-internal path deps (forge-tui -> forge-sdk, etc.) use
# `path = "..."` without a version pin. cargo-deny treats those as
# wildcards by default; this allowance scopes the wildcard ban to
# public-registry deps only.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
