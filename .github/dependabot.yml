version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      cargo:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # Majors stay ungrouped: each needs call-site work, which a batch would bury.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: monthly
