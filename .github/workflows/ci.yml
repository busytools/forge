name: CI

on:
  pull_request:
  push:
    branches: [main]

# A pull request's next push supersedes its run. A push to main keeps a group
# of its own: cancelling one leaves that commit with no run of this workflow
# to point at, and its verdict should not wait on the next merge. Keyed on the
# commit, so consecutive merges each keep theirs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
        with:
          components: rustfmt
      - run: cargo fmt --check

  unicode-punct:
    name: unicode punctuation gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/check_no_unicode_punctuation.sh

  script-tests:
    name: release script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/test_update_manifest.py

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # forge-dictate captures audio through cpal, whose Linux backend
      # is ALSA; without the headers `alsa-sys` fails to build and every
      # compiling job dies. Removing this breaks audio, not just CI.
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: ./.github/actions/rust
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cargo-${{ runner.os }}
          key: clippy
      - run: cargo clippy --all-targets --workspace -- -D warnings
      - run: cargo clippy --all-targets --workspace --all-features -- -D warnings

  test:
    name: cargo nextest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # forge-dictate captures audio through cpal, whose Linux backend
      # is ALSA; without the headers `alsa-sys` fails to build and every
      # compiling job dies. Removing this breaks audio, not just CI.
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cargo-${{ runner.os }}
          key: test
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --workspace --all-features
      # nextest executes no doctest and `--all-targets` builds none, so
      # without this step the Rust fences under `crates/*/src/` are compiled
      # by no job. Here rather than in either docs job: the dev-profile
      # build it needs is already warm from nextest, while `cargo doc` and
      # `cargo check --all-targets` both leave dependencies metadata-only,
      # so a doctest beside either rebuilds the whole graph.
      - run: cargo test --doc --workspace --all-features

  release:
    name: cargo check --release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # forge-dictate captures audio through cpal, whose Linux backend
      # is ALSA; without the headers `alsa-sys` fails to build and every
      # compiling job dies. Removing this breaks audio, not just CI.
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cargo-${{ runner.os }}
          key: release
      - run: cargo check --release --workspace --all-targets --all-features

  # The two forge-tui configurations nothing else builds: the one
  # `scripts/install.sh` produces (release, `perf` on, the test-only
  # features off) and `testing` on its own. The job above covers
  # neither - with every feature on, it never exercises which
  # configuration enables what: the install build leaving
  # `test-helpers` off, or `testing` having to forward it.
  feature-configs:
    name: cargo check (install.sh + testing configs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # forge-dictate captures audio through cpal, whose Linux backend
      # is ALSA; without the headers `alsa-sys` fails to build and every
      # compiling job dies. Removing this breaks audio, not just CI.
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cargo-${{ runner.os }}
          key: feature-configs
      - run: cargo check --locked --release -p forge-tui --bin forge --features perf
      - run: cargo check --locked -p forge-tui --features testing

  docs:
    name: cargo doc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      # forge-dictate captures audio through cpal, whose Linux backend
      # is ALSA; without the headers `alsa-sys` fails to build and every
      # compiling job dies. Removing this breaks audio, not just CI.
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cargo-${{ runner.os }}
          key: docs
      - run: cargo doc --workspace --no-deps --all-features

  # The client is not a cargo workspace member, so no other job here reaches
  # it: without this the client's steps run only when a person types them,
  # and a gate that does not run reports what a gate that passes does. The
  # steps are `just check`'s client recipes, in its order, plus the build.
  client:
    name: client format, lint, build, typecheck and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck:markup
      - run: npm run typecheck
      - run: npm test

  # The android target's warnings check: the shell crate compiled for
  # aarch64-linux-android with warnings denied. **No other job compiles
  # this target**, so a desktop-only helper going dead there passes every
  # other gate and surfaces only when someone runs the android check by
  # hand - measured: the hint mask's failure-flush helpers reached a review
  # that way. The target itself is host-independent; what this job adds is
  # the ubuntu host-side compile of the build dependencies, which no local
  # run can prove. It mirrors `just check`'s `client-android-warnings` step.
  client-android:
    name: client android warnings check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
      - run: rustup target add aarch64-linux-android
      - run: RUSTFLAGS="-D warnings" cargo check --manifest-path client/src-tauri/Cargo.toml --target aarch64-linux-android
