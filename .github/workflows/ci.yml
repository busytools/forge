name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
        with:
          components: rustfmt
      - run: cargo fmt --check

  unicode-punct:
    name: unicode punctuation gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/check_no_unicode_punctuation.sh

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # forge-dictate captures audio through cpal, whose Linux backend
      # is ALSA; without the headers `alsa-sys` fails to build and every
      # compiling job dies. Removing this breaks audio, not just CI.
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: ./.github/actions/rust
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cargo-${{ runner.os }}
          key: clippy
      # Every cargo command that is meant to check the tree runs through
      # `require_compiled.sh`, here and in the jobs below: one that finds
      # every unit fresh exits 0 having checked nothing, and that is
      # indistinguishable from a clean tree. `cargo fmt --check` and the
      # client's steps stay bare - they compile nothing by design and say
      # so by their names.
      - run: ./scripts/require_compiled.sh cargo clippy --all-targets --workspace -- -D warnings
      - run: ./scripts/require_compiled.sh cargo clippy --all-targets --workspace --all-features -- -D warnings

  test:
    name: cargo nextest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # forge-dictate captures audio through cpal, whose Linux backend
      # is ALSA; without the headers `alsa-sys` fails to build and every
      # compiling job dies. Removing this breaks audio, not just CI.
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cargo-${{ runner.os }}
          key: test
      - uses: taiki-e/install-action@nextest
      - run: ./scripts/require_compiled.sh cargo nextest run --workspace --all-features

  release:
    name: cargo check --release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # forge-dictate captures audio through cpal, whose Linux backend
      # is ALSA; without the headers `alsa-sys` fails to build and every
      # compiling job dies. Removing this breaks audio, not just CI.
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cargo-${{ runner.os }}
          key: release
      - run: ./scripts/require_compiled.sh cargo check --release --workspace --all-targets --all-features

  # The two forge-tui configurations nothing else builds: the one
  # `scripts/install.sh` produces (release, `perf` on, the test-only
  # features off) and `testing` on its own. The job above covers
  # neither - with every feature on, it never exercises which
  # configuration enables what: the install build leaving
  # `test-helpers` off, or `testing` having to forward it.
  feature-configs:
    name: cargo check (install.sh + testing configs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # forge-dictate captures audio through cpal, whose Linux backend
      # is ALSA; without the headers `alsa-sys` fails to build and every
      # compiling job dies. Removing this breaks audio, not just CI.
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cargo-${{ runner.os }}
          key: feature-configs
      - run: ./scripts/require_compiled.sh cargo check --locked --release -p forge-tui --bin forge --features perf
      - run: ./scripts/require_compiled.sh cargo check --locked -p forge-tui --features testing

  docs:
    name: cargo doc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      # forge-dictate captures audio through cpal, whose Linux backend
      # is ALSA; without the headers `alsa-sys` fails to build and every
      # compiling job dies. Removing this breaks audio, not just CI.
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cargo-${{ runner.os }}
          key: docs
      - run: ./scripts/require_compiled.sh cargo doc --workspace --no-deps --all-features

  # The client is not a cargo workspace member, so no other job here reaches
  # it: without this the client's steps run only when a person types them,
  # and a gate that does not run reports what a gate that passes does. The
  # steps are `just check`'s client recipes, in its order, plus the build.
  client:
    name: client format, lint, build, typecheck and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck:markup
      - run: npm run typecheck
      - run: npm test
