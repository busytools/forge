name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/rust
        with:
          components: rustfmt
      - run: cargo fmt --check

  unicode-punct:
    name: unicode punctuation gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/check_no_unicode_punctuation.sh

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # forge-dictate captures audio through cpal, whose Linux backend
      # is ALSA; without the headers `alsa-sys` fails to build and every
      # compiling job dies. Removing this breaks audio, not just CI.
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: ./.github/actions/rust
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cargo-${{ runner.os }}
          key: clippy
      - run: cargo clippy --all-targets --workspace -- -D warnings
      - run: cargo clippy --all-targets --workspace --all-features -- -D warnings

  test:
    name: cargo nextest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # forge-dictate captures audio through cpal, whose Linux backend
      # is ALSA; without the headers `alsa-sys` fails to build and every
      # compiling job dies. Removing this breaks audio, not just CI.
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cargo-${{ runner.os }}
          key: test
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --workspace --all-features

  release:
    name: cargo check --release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # forge-dictate captures audio through cpal, whose Linux backend
      # is ALSA; without the headers `alsa-sys` fails to build and every
      # compiling job dies. Removing this breaks audio, not just CI.
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cargo-${{ runner.os }}
          key: release
      - run: cargo check --release --workspace --all-targets --all-features

  docs:
    name: cargo doc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v5
      # forge-dictate captures audio through cpal, whose Linux backend
      # is ALSA; without the headers `alsa-sys` fails to build and every
      # compiling job dies. Removing this breaks audio, not just CI.
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cargo-${{ runner.os }}
          key: docs
      - run: cargo doc --workspace --no-deps --all-features
