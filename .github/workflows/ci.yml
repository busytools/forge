name: CI

on:
  pull_request:
  push:
    branches: [main]

# `pull-requests: read` is what lets `changes` read a pull request's
# changed-file list over the REST API. Everything else here reads the
# checkout alone.
permissions:
  contents: read
  pull-requests: read

# A pull request's next push supersedes its run. A push to main keeps a group
# of its own: cancelling one leaves that commit with no run of this workflow
# to point at, and its verdict should not wait on the next merge. Keyed on the
# commit, so consecutive merges each keep theirs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # **Each build and test job below runs only for the paths it serves**, and
  # one aggregate decides the pull request. `changes` names the path groups,
  # each job is conditional on its own group, and `ci-required` always runs,
  # depends on every job, and fails when a job that ran failed or when a job
  # whose paths changed was skipped. A skipped job therefore means "nothing it
  # covers moved", never "the gate passed without looking". Only the `changes`
  # job, the Unicode gate and the aggregate itself are unfiltered: the first
  # names the paths, the gate scans every file type, and the aggregate reports
  # when everything else skipped.
  #
  # `gate` is the fail-safe group: a change to the gate's own definition
  # (this file, the composite action, the justfile) runs everything.
  #
  # **A new job is invisible to the aggregate unless it is also listed in
  # `ci-required`'s `needs`**: that check reads only what it depends on.
  changes:
    name: changed paths
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      client: ${{ steps.filter.outputs.client }}
      client_tauri: ${{ steps.filter.outputs.client_tauri }}
      browser: ${{ steps.filter.outputs.browser }}
      scripts: ${{ steps.filter.outputs.scripts }}
      gate: ${{ steps.filter.outputs.gate }}
    steps:
      # A pull request reads its changed-file list from the REST API and
      # needs no checkout; a push compares against the previous commit,
      # which a default shallow clone does not carry.
      - uses: actions/checkout@v7
        if: github.event_name != 'pull_request'
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # The `client` filter excludes the shell directory, and under the
          # default 'some' quantifier a negated rule is ignored, so a
          # `client/src-tauri` change would match it and run the client job.
          predicate-quantifier: 'some-with-excludes'
          filters: |
            rust:
              - 'crates/**'
              - 'vendor/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'rustfmt.toml'
              - 'clippy.toml'
              - '.config/nextest.toml'
              - 'scripts/install.sh'
            client:
              - 'client/**'
              - '!client/src-tauri/**'
            client_tauri:
              - 'client/src-tauri/**'
              - 'crates/forge-capture/**'
              # The shell's clippy reads the repo-root config, and
              # forge-capture inherits its workspace fields from here.
              - 'clippy.toml'
              - 'Cargo.toml'
              - 'rust-toolchain.toml'
            # The macOS-only workspace half is the browser host, and only a
            # macOS runner compiles it; a change here must run that job even
            # when no client file moved. **The live gate is the server's
            # browser_service test** over the workspace's browser port, so the
            # files it compiles or drives are this job's paths too.
            # **The list is forge-server's dependency graph**, because the
            # macOS job compiles forge-server and its live test: every crate
            # that may break that build runs it, and so does the lockfile
            # that resolves them. forge-test-harness is not on this graph.
            browser:
              - 'crates/forge-browser/**'
              - 'crates/forge-server/**'
              - 'crates/forge-workspace/**'
              - 'crates/forge-agent/**'
              - 'crates/forge-gateway/**'
              - 'crates/forge-connectors/**'
              - 'crates/forge-dictate/**'
              # The speaking engine's crate is on the macOS job's build and
              # its voice facade drives it.
              - 'crates/forge-tts/**'
              - 'crates/forge-capture/**'
              - 'crates/forge-system-one/**'
              - 'crates/forge-sdk/**'
              - 'crates/forge-primitives/**'
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'rust-toolchain.toml'
              - 'clippy.toml'
              - 'scripts/**'
              - '.config/nextest.toml'
            scripts:
              - 'scripts/**'
            gate:
              - 'justfile'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'

  fmt:
    name: cargo fmt --check
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.client_tauri == 'true' || needs.changes.outputs.gate == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
        with:
          components: rustfmt
      - run: cargo fmt --check
      # The client shell is a workspace root of its own, so the check above
      # does not reach its crate; this is the invocation that does.
      - run: cargo fmt --manifest-path client/src-tauri/Cargo.toml --check

  unicode-punct:
    name: unicode punctuation gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/check_no_unicode_punctuation.sh

  ui-word-count:
    name: ui word-count gate
    # No path filter, like the punctuation gate: a docs-only pull request is
    # exactly the one this exists for.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./docs/book/ui-word-count.sh

  script-tests:
    # The display name stays `release script tests` until the ruleset stops
    # requiring it: renaming it now leaves a pull request waiting for a
    # check that no longer reports.
    name: release script tests
    needs: changes
    if: needs.changes.outputs.scripts == 'true' || needs.changes.outputs.gate == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The vendor-patch test runs the patcher with node, at the version the
      # repo pins in scripts/vendor_browser_stack.sh.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      # The recipe is what runs the scripts, so the step's composition has one
      # home; `just` is here for it and for the client-dependency pin, which
      # drives the recipe the gate runs.
      - uses: taiki-e/install-action@just
      - run: just script-tests

  clippy:
    name: cargo clippy
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.gate == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # forge-capture opens the microphone through cpal, whose Linux
      # backend is ALSA; without the headers `alsa-sys` fails to build and
      # every compiling job dies. Removing this breaks audio, not just CI.
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: ./.github/actions/rust
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cargo-${{ runner.os }}
          key: clippy
      - run: cargo clippy --all-targets --workspace -- -D warnings
      - run: cargo clippy --all-targets --workspace --all-features -- -D warnings

  # **The same lint on the platform the job above cannot see.** Ubuntu
  # compiles out every `cfg(target_os = "macos")` arm, so a lint failure in
  # one passes there unseen. This runs the workspace clippy with every feature
  # on, on a macOS runner and on the same paths, because it guards the same
  # source rather than a second set of files. The Linux job's second
  # invocation is the same command.
  clippy-macos:
    name: cargo clippy (macOS)
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.gate == 'true'
    runs-on: macos-15
    env:
      # cef-dll-sys unpacks the distribution under CEF_PATH/<version> and
      # downloads it only when that directory is missing.
      CEF_PATH: ${{ github.workspace }}/.cef-cache
    steps:
      - uses: actions/checkout@v7
      # Shared with the macOS job below: the workspace's lock carries the
      # pinned CEF version, so an unrelated dependency move reuses this cache.
      - name: Read the pinned CEF version
        id: cef
        run: |
          version=$(awk '/^name = "cef-dll-sys"$/{getline; sub(/^version = "/, ""); sub(/"$/, ""); print}' Cargo.lock)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: .cef-cache
          key: cef-${{ runner.os }}-${{ runner.arch }}-${{ steps.cef.outputs.version }}-${{ github.workflow }}
      - uses: ./.github/actions/rust
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cargo-${{ runner.os }}
          key: clippy
      - run: cargo clippy --workspace --all-features --all-targets -- -D warnings

  test:
    name: cargo nextest
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.gate == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # forge-capture opens the microphone through cpal, whose Linux
      # backend is ALSA; without the headers `alsa-sys` fails to build and
      # every compiling job dies. Removing this breaks audio, not just CI.
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cargo-${{ runner.os }}
          key: test
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --workspace --all-features
      # nextest executes no doctest and `--all-targets` builds none, so
      # without this step the Rust fences under `crates/*/src/` are compiled
      # by no job. Here rather than in either docs job: the dev-profile
      # build it needs is already warm from nextest, while `cargo doc` and
      # `cargo check --all-targets` both leave dependencies metadata-only,
      # so a doctest beside either rebuilds the whole graph.
      - run: cargo test --doc --workspace --all-features

  release:
    name: cargo check --release
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.gate == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # forge-capture opens the microphone through cpal, whose Linux
      # backend is ALSA; without the headers `alsa-sys` fails to build and
      # every compiling job dies. Removing this breaks audio, not just CI.
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cargo-${{ runner.os }}
          key: release
      - run: cargo check --release --workspace --all-targets --all-features

  # The two server configurations nothing else builds: the one
  # `scripts/install.sh` produces (release, the test-only features off)
  # and `testing` on its own. The job above covers neither - with every
  # feature on, it never exercises which configuration enables what: the
  # install build leaving `test-helpers` off, or `testing` having to
  # forward it. It also runs the install: the shipped binary is the only
  # artifact that runs outside the build tree, and transcribe's shared
  # ggml has to resolve from beside it with no LD_LIBRARY_PATH.
  feature-configs:
    name: "install config: check and installed binary"
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.gate == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # forge-capture opens the microphone through cpal, whose Linux
      # backend is ALSA; without the headers `alsa-sys` fails to build and
      # every compiling job dies. Removing this breaks audio, not just CI.
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cargo-${{ runner.os }}
          key: feature-configs
      - run: cargo check --locked --release -p forge-server --bin forge
      - run: cargo check --locked -p forge-server --features testing
      # The install is the whole path a user gets, and these are the two
      # things their machine does without: no library path, and the loader
      # naming the copy installed beside the binary.
      - name: The installed binary resolves its libraries
        env:
          CARGO_INSTALL_ROOT: ${{ runner.temp }}/forge-install
          FORGE_ZSH_COMPLETION_DIR: ${{ runner.temp }}/forge-zsh
        run: |
          scripts/install.sh
          bin="$CARGO_INSTALL_ROOT/bin/forge"
          env -u LD_LIBRARY_PATH "$bin" --version
          # ldd indents its lines, and a no-match grep must reach the emptiness
          # check rather than abort the step under pipefail.
          libs=$(env -u LD_LIBRARY_PATH ldd "$bin" | grep -E '^[[:space:]]*(libtranscribe|libggml)' || true)
          if [ -z "$libs" ]; then
            echo "the installed binary links no transcribe/ggml libraries" >&2
            exit 1
          fi
          if echo "$libs" | grep -vFq -- "$CARGO_INSTALL_ROOT/bin/"; then
            echo "$libs" | grep -vF -- "$CARGO_INSTALL_ROOT/bin/" >&2
            echo "the libraries above do not resolve from beside the installed binary" >&2
            exit 1
          fi
          # Control: the boot check must be sensitive to the installed copy.
          resolved=$(echo "$libs" | awk '/^[[:space:]]*libtranscribe/ {print $3}')
          mv "$resolved" "$resolved.aside"
          if env -u LD_LIBRARY_PATH "$bin" --version > /dev/null 2>&1; then
            echo "the binary booted with $resolved moved away" >&2
            exit 1
          fi
          mv "$resolved.aside" "$resolved"
          echo "installed binary boots with $(echo "$libs" | wc -l | tr -d ' ') transcribe/ggml libraries resolved from $CARGO_INSTALL_ROOT/bin"

  docs:
    name: cargo doc
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.gate == 'true'
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      # forge-capture opens the microphone through cpal, whose Linux
      # backend is ALSA; without the headers `alsa-sys` fails to build and
      # every compiling job dies. Removing this breaks audio, not just CI.
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cargo-${{ runner.os }}
          key: docs
      - run: cargo doc --workspace --no-deps --all-features

  # The client is not a cargo workspace member, so no other job here reaches
  # it: without this the client's steps run only when a person types them,
  # and a gate that does not run reports what a gate that passes does. The
  # steps are `just check`'s frontend client recipes, in its order, plus the
  # build and `scripts/check_client_wasm.py` - a CI-only step, because the
  # local gate builds no frontend for it to ride. The shell's own Rust steps
  # live in the `client-tauri` job below
  # and in the `fmt` job above; the android warnings step has no job, because
  # its vendoring refuses non-macOS hosts (#1959, closed as an enhancement
  # and tracked in #2258).
  client:
    name: client format, lint, build, typecheck and tests
    needs: changes
    if: needs.changes.outputs.client == 'true' || needs.changes.outputs.gate == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      # The highlighter's Oniguruma engine ships as a wasm chunk, and a build
      # that lost it draws every code panel plain. The check reads the
      # reference out of the highlight chunk; a loose `wasm-*.js` glob would
      # pass on the unrelated chunk the build also emits.
      - run: python3 ../scripts/check_client_wasm.py dist
      - run: npm run typecheck:markup
      - run: npm run typecheck
      - run: npm test

  # The shell crate under `client/src-tauri/` is a cargo workspace root of its
  # own, so no other job here compiles it. `just check` runs its clippy and
  # its tests (`client-tauri-clippy`, `client-tauri-test`), and this job runs
  # the same two recipes: without it they run only when a person types them,
  # and a gate that does not run reports what a gate that passes does.
  #
  # The crate links the webview stack and, through `forge-capture`, cpal's
  # Linux backend, so the runner takes Tauri's own Linux prerequisite list
  # plus ALSA. The tests themselves need no browser and no vendored stack:
  # every case that does is `#[ignore]`d.
  client-tauri:
    name: client shell clippy and tests
    needs: changes
    if: needs.changes.outputs.client_tauri == 'true' || needs.changes.outputs.gate == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The webview stack the crate links: `libwebkit2gtk-4.1-dev` is Tauri's
      # own entry and pulls GTK, libsoup and JavaScriptCore with it, so the
      # rest of the list is Tauri's; `libasound2-dev` is cpal's Linux backend,
      # as in the jobs above.
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev
      - uses: ./.github/actions/rust
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cargo-${{ runner.os }}
          key: client-tauri
          # The crate carries its own target dir, which the default root
          # workspace would not cache.
          workspaces: client/src-tauri -> target
      - uses: taiki-e/install-action@nextest
      - uses: taiki-e/install-action@just
      - run: just client-tauri-clippy
      - run: just client-tauri-test

  # **The macOS-only halves, built and run.** The CEF code is macOS-gated on
  # BOTH sides: the workspace's `forge-browser` (the host, its ring, the
  # driver and the service) and the shell's native overlay. The clippy job
  # above lints the workspace half, but Ubuntu jobs prove the rest compiles
  # and the stubs refuse by name, and no Linux runner can build either half.
  # This job does: the workspace's macOS-only crates in the server binary's
  # configuration, then the shell's own steps.
  client-tauri-macos:
    name: client shell and browser host (macOS)
    needs: changes
    if: needs.changes.outputs.client_tauri == 'true' || needs.changes.outputs.browser == 'true' || needs.changes.outputs.scripts == 'true' || needs.changes.outputs.gate == 'true'
    runs-on: macos-15
    env:
      # cef-dll-sys unpacks the distribution under CEF_PATH/<version> and
      # downloads it only when that directory is missing.
      CEF_PATH: ${{ github.workspace }}/.cef-cache
    steps:
      - uses: actions/checkout@v7
      # The distribution is what this job downloads: cef-dll-sys fetches a
      # 307 MB archive on a cold build. Keyed on the pinned cef-dll-sys
      # version rather than the lockfile, so an unrelated dependency move
      # does not pay for the download again. **The workspace's lock carries
      # it**: the browser host is where CEF lives now, and the client's own
      # lock no longer names it. The wrapper's cmake/ninja build stays in
      # rust-cache below: that is target-dir output keyed by the lockfile,
      # which is what rust-cache covers.
      - name: Read the pinned CEF version
        id: cef
        run: |
          version=$(awk '/^name = "cef-dll-sys"$/{getline; sub(/^version = "/, ""); sub(/"$/, ""); print}' Cargo.lock)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: .cef-cache
          key: cef-${{ runner.os }}-${{ runner.arch }}-${{ steps.cef.outputs.version }}-${{ github.workflow }}
      - uses: ./.github/actions/rust
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cargo-${{ runner.os }}
          key: client-tauri
          workspaces: |
            . -> target
            client/src-tauri -> target
      - uses: taiki-e/install-action@nextest
      - uses: taiki-e/install-action@just
      # The server's browser host and the server arm that installs it: a
      # compile error here passes every Ubuntu job.
      - run: cargo check -p forge-browser -p forge-server --all-targets
      # The macOS half of the install proof: the same script into a temp
      # root, then a boot with no DYLD_* library path. @loader_path and the
      # copied dylibs are macOS-only, so the Ubuntu job cannot cover this.
      # The browser stage is skipped: the bundle and driver it downloads are
      # exercised by the steps around this one.
      - name: The installed binary resolves its libraries (macOS)
        env:
          CARGO_INSTALL_ROOT: ${{ runner.temp }}/forge-install-macos
          FORGE_ZSH_COMPLETION_DIR: ${{ runner.temp }}/forge-zsh-macos
          FORGE_INSTALL_BROWSER: "0"
        run: |
          scripts/install.sh
          bin="$CARGO_INSTALL_ROOT/bin/forge"
          env -u DYLD_LIBRARY_PATH -u DYLD_FALLBACK_LIBRARY_PATH "$bin" --version
          # A no-match grep reaches the emptiness check below, not an abort.
          loaded=$(env -u DYLD_LIBRARY_PATH -u DYLD_FALLBACK_LIBRARY_PATH \
            DYLD_PRINT_LIBRARIES=1 "$bin" --version 2>&1 \
            | grep -E '/(libtranscribe|libggml)[^/]*\.dylib' || true)
          if [ -z "$loaded" ]; then
            echo "the installed binary loaded no transcribe/ggml libraries" >&2
            exit 1
          fi
          if echo "$loaded" | grep -vFq -- "$CARGO_INSTALL_ROOT/bin/"; then
            echo "$loaded" | grep -vF -- "$CARGO_INSTALL_ROOT/bin/" >&2
            echo "the libraries above do not load from beside the installed binary" >&2
            exit 1
          fi
          echo "installed binary boots with $(echo "$loaded" | wc -l | tr -d ' ') transcribe/ggml libraries from $CARGO_INSTALL_ROOT/bin"
      # **This is the only place the FSEvents watch runs.** The config watch
      # tests are macOS-ignored because the maintainer's loaded machine stalls
      # fsevents delivery; Ubuntu runs them on inotify, which is a different
      # backend. This quiet runner covers single-file `NonRecursive` delivery,
      # the debounce and `slow_rearm` on FSEvents, and the boot edit reaching
      # a running workspace; the re-arm stays Linux-only, since macOS survives
      # a rename-over without it. Scoped to the family so no other ignored or
      # live test is swept in.
      - run: cargo nextest run -p forge-agent --lib --run-ignored ignored-only -E 'test(config_watch)'
      - run: cargo nextest run -p forge-server --lib --run-ignored ignored-only -E 'test(a_config_edit_reaches_the_running_workspace)'
      # The host's own tests are macOS-gated, so the Ubuntu workspace job
      # skips them by name; this is where they run. One of them identifies a
      # host by the INSTALLED bundle's path, so this job stages one where
      # `just install` would put it.
      - run: cargo build -p forge-browser --bin forge-browser
      - run: scripts/stage-browser-host.sh
        env:
          FORGE_BROWSER_BIN: target/debug/forge-browser
      # `--run-ignored all` includes the host tests that need the installed
      # bundle: the staged one above is at this crate's version, which is
      # exactly what the service checks before launching.
      - run: cargo nextest run -p forge-browser --all-features --run-ignored all
      # **The fleet end to end**: the server's live browser test drives the
      # staged host through the vendored driver. It needs the driver stack,
      # which `just install` also vendors, and the host bundle staged above.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: scripts/vendor_browser_stack.sh
        env:
          FORGE_BROWSER_STACK_DIR: ${{ runner.temp }}/forge-browser-stack
      - run: cargo nextest run -p forge-server --test browser_service --run-ignored ignored-only
        env:
          FORGE_BROWSER_TEST_STACK: ${{ runner.temp }}/forge-browser-stack
      # **The host arms and the surface parity, live**: the two tools the
      # driver does not have, the two arguments it does not take, and the
      # check that every advertised spec is answered by the driver or by a
      # host arm. Same host bundle and stack as the service test above.
      - run: cargo nextest run -p forge-server --test browser_custom_live --test surface_parity_live --run-ignored ignored-only
        env:
          FORGE_BROWSER_TEST_STACK: ${{ runner.temp }}/forge-browser-stack
      - run: just client-tauri-clippy
      - run: just client-tauri-test

  # **This workflow's required check**, beside the docs workflow's
  # `build site`. GitHub treats a skipped job as a passing required check,
  # which is the hole a path filter opens: a typo in a filter, a renamed job
  # or a pattern that stopped matching would report green having run nothing.
  # This job always runs, reads every job's result
  # and the paths its group covers, and fails unless each job either passed
  # or was skipped with its paths unchanged. That is what makes a skip a
  # statement about paths rather than about the job.
  ci-required:
    name: ci-required
    if: always()
    needs:
      - changes
      - fmt
      - unicode-punct
      - ui-word-count
      - script-tests
      - clippy
      - clippy-macos
      - test
      - release
      - feature-configs
      - docs
      - client
      - client-tauri
      - client-tauri-macos
    runs-on: ubuntu-latest
    steps:
      - name: Every job ran or was skipped with its paths unchanged
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS"])

          # Each job's path group. `gate` short-circuits every group, and an
          # empty tuple is a job with no filter, which must always run.
          groups = {
              "fmt": ("rust", "client_tauri"),
              "unicode-punct": (),
              "ui-word-count": (),
              "script-tests": ("scripts",),
              "clippy": ("rust",),
              "clippy-macos": ("rust",),
              "test": ("rust",),
              "release": ("rust",),
              "feature-configs": ("rust",),
              "docs": ("rust",),
              "client": ("client",),
              "client-tauri": ("client_tauri",),
              "client-tauri-macos": ("client_tauri", "browser", "scripts"),
          }

          problems = []

          changes = needs.get("changes", {})
          if changes.get("result") != "success":
              problems.append(f"changes: {changes.get('result', 'missing')}")

          outputs = changes.get("outputs") or {}

          # A filter renamed in `changes` and not here would leave an empty
          # output, and an empty output reads as "nothing moved": the skip
          # would pass. Every output this job reads must say true or false.
          expected_outputs = {"gate"}
          for names in groups.values():
              expected_outputs.update(names)
          for name in sorted(expected_outputs):
              if outputs.get(name) not in ("true", "false"):
                  problems.append(f"changes: output {name} missing or not true/false")

          def moved(*names):
              return any(outputs.get(name) == "true" for name in names)

          for job, names in groups.items():
              job_result = needs.get(job)
              if job_result is None:
                  problems.append(f"{job}: missing from needs")
                  continue
              expected = moved("gate", *names) if names else True
              result = job_result["result"]
              if result == "success":
                  continue
              if result == "skipped" and not expected:
                  continue
              suffix = ", but the paths it serves changed" if expected else ""
              problems.append(f"{job}: {result}{suffix}")

          for job in sorted(set(needs) - set(groups) - {"changes"}):
              problems.append(f"{job}: in needs with no path group here")

          if problems:
              print("ci-required failed:")
              for problem in problems:
                  print(f"  - {problem}")
              sys.exit(1)

          print("ci-required: every job ran or was skipped with its paths unchanged")
          PY
