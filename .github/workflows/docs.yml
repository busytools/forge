name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Default for any job that does not set its own; both jobs below
# widen it, the build job to read Pages config and the deploy job to
# publish.
permissions:
  contents: read

# Serialise deploys without cancelling one mid-publish; a cancelled
# deploy can leave the Pages site half-updated.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: mdbook build
    # A pull request from a fork cannot deploy and has nothing to gain
    # from running here, so it is skipped outright.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted-linux
    # `configure-pages` reads the Pages config over the API, which the
    # workflow-level `contents: read` alone would deny. A job-level
    # block replaces the workflow default outright, so checkout's
    # `contents: read` has to be restated here.
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v5

      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.4

      - run: mdbook build docs/book

      # Reads the repo's Pages config, so it fails until Pages is
      # enabled by hand: Settings, Pages, Source = GitHub Actions.
      # That cannot be done from inside the repo and needs it public.
      # Skipped on pull requests, so nothing here is exercised until
      # the first push to main.
      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: target/book

  deploy:
    name: deploy to pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: self-hosted-linux
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
