# The dist is served from `current`, a symlink the poller flips when a new
# release lands, so an update is picked up on the next request and nginx is
# never restarted.
#
# `no-cache` plus an ETag is the rule that keeps a swapped build from hiding:
# a browser must revalidate what it already has, and the ETag is what makes
# the revalidation cheap and correct. Without them a stale bundle survives
# the swap for as long as whatever cache in the path chose to keep it.
server {
    listen 8080;
    server_name _;
    root /srv/forge-web/current;
    index index.html;

    etag on;
    add_header Cache-Control "no-cache" always;

    # The client's pages are real URLs, so anything unknown is the app's own
    # routing rather than a missing file.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The manifest is a fact about the app rather than an asset, and it is
    # rewritten when a release lands. It sits BESIDE the served build rather
    # than inside it - the poller swaps the build but only rewrites this - so
    # the location names the file itself; the root would look for it inside
    # `current` and 404. `add_header` in a location replaces the server's, so
    # it is repeated here.
    location = /latest.json {
        alias /srv/forge-web/latest.json;
        add_header Cache-Control "no-cache" always;
    }
}
