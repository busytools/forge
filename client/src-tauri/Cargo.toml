[package]
name = "forge-client"
version = "1.1.21"
description = "The forge desktop client"
edition = "2024"
rust-version = "1.90"
# Two binaries exist (the app and CEF's helper); the bundler needs to be told
# which one the app is.
default-run = "forge-client"

# Its own workspace root, so the crate above is not a member of forge's: the
# shell links the whole webview stack, and it is the shipping build - minutes
# of compile - that neither `just check` nor CI carries for every Rust-only
# change; the crate's clippy and tests ride both.
# `just client-tauri-check` builds it, `client-tauri-bundle` adds the bundles.
[workspace]

[lib]
# The Android target links the app as a native library; a binary-only crate
# gives `tauri android build` no library target to build.
crate-type = ["staticlib", "cdylib", "rlib"]

# CEF's subprocesses are these, laid out by `scripts/bundle-cef.sh` as the
# `forge-client Helper*.app` bundles CEF looks for.
[[bin]]
name = "forge_client_helper"
path = "src/bin/forge_client_helper.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `generate_context!` embeds the config's `plugins` section through serde_json.
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
# The browser host: an MCP CLIENT for the first time on this side of forge.
# rmcp carries the child-process transport, id correlation and cancellation
# the driver needs, so the host speaks MCP rather than reimplementing it.
rmcp = { version = "=3.5.0", features = ["client", "transport-child-process"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["process", "rt-multi-thread", "macros", "time", "fs", "net", "sync"] }
# The client's socket, pinned here rather than by the workspace (this crate is
# its own workspace root). **TLS is on**, matching the workspace's own feature
# set: a page may be served on wss://, and the webview's own WebSocket would
# connect where this half could not, which is a fork nobody would see.
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
# The driver's image parts cross as base64; the wire wants the raw bytes.
base64 = "0.22"
# The launch lock: flock, the same idiom the workspace's single-instance
# guard uses.
rustix = { version = "1", features = ["fs"] }
# The desktop's own microphone: the server workspace's capture leaf, so a
# take opens the device natively instead of through the webview's audio
# pipeline. Deliberately NOT `forge-dictate`: that crate carries the speech
# models, which this shell has no use for and Android cannot build.
forge-capture = { path = "../../crates/forge-capture" }

# Desktop-only: no plugin path exists for Android, where the APK updates
# through the system installer instead (a Kotlin side of its own).
[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"

# **The app's own Chromium, macOS first.** Only the host process initializes
# CEF; the client's UI process never does (see `browser::cef`). The framework
# and the five helper apps are laid into the built bundle by
# `scripts/bundle-cef.sh`.
[target.'cfg(target_os = "macos")'.dependencies]
cef = { version = "=154.5.0", features = ["build-util"] }
libc = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSArray",
    "NSDate",
    "NSProcessInfo",
    "NSRunLoop",
    "NSString",
    "NSTimer",
    "NSURL",
] }
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSEvent",
    "NSGraphics",
    "NSOpenPanel",
    "NSPanel",
    "NSPasteboard",
    "NSResponder",
    "NSSavePanel",
    "NSTrackingArea",
    "NSView",
    "NSWindow",
] }
objc2-core-foundation = { version = "0.3", features = ["CFData"] }
objc2-core-graphics = { version = "0.3", features = [
    "CGColorSpace",
    "CGDataProvider",
    "CGImage",
] }
objc2-quartz-core = { version = "0.3", features = ["CALayer"] }

[dev-dependencies]
tempfile = "3"
# `start_paused`, for the launch lock's wait path under a clock the test drives.
tokio = { version = "1", features = ["test-util"] }
# The `test` feature is what carries `tauri::test::mock_builder`: the boot
# pin drives the setup's browser act under a mock app. Dev-only; the shipped
# build resolves the dependency without it.
tauri = { version = "2", features = ["test"] }
# The live tests print the host's own tracing: the `log` facade the host
# writes through, uninitialised in a test run otherwise.
log = "0.4"
# The raise-path tests stand in for a browser's devtools endpoint - HTTP and
# the CDP websocket both - so the window moves run without a window anywhere.
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
