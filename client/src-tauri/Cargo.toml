[package]
name = "forge-client"
version = "1.1.32"
description = "The forge desktop client"
edition = "2024"
rust-version = "1.90"
# The app's own binary; the bundler needs to be told which one it is.
default-run = "forge-client"

# Its own workspace root, so the crate above is not a member of forge's: the
# shell links the whole webview stack, and it is the shipping build - minutes
# of compile - that neither `just check` nor CI carries for every Rust-only
# change; the crate's clippy and tests ride both.
# `just client-tauri-check` builds it, `client-tauri-bundle` adds the bundles.
[workspace]

[lib]
# The Android target links the app as a native library; a binary-only crate
# gives `tauri android build` no library target to build.
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# **The overlay view's ivars are main-thread-only**, so its check is a
# harness-free target whose `main` runs on the process main thread; this
# feature carries the entry point there. Production builds never enable it.
testing = []
# **A look-only driver for the built bundle.** The agent testing this machine
# has neither Accessibility nor Screen Recording, so the app drives itself
# over a socket (full screen, its own page's JavaScript, its windows, a
# screenshot of itself). Production bundles never enable it.
look-driver = ["dep:block2", "dep:objc2-web-kit"]

[[test]]
name = "overlay_ivars"
harness = false
required-features = ["testing"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `generate_context!` embeds the config's `plugins` section through serde_json.
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["process", "rt-multi-thread", "macros", "time", "fs", "net", "sync"] }
# The client's socket, pinned here rather than by the workspace (this crate is
# its own workspace root). **TLS is on**, matching the workspace's own feature
# set: a page may be served on wss://, and the webview's own WebSocket would
# connect where this half could not, which is a fork nobody would see.
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
# The driver's image parts cross as base64; the wire wants the raw bytes.
base64 = "0.22"
# The desktop's own microphone: the server workspace's capture leaf, so a
# take opens the device natively instead of through the webview's audio
# pipeline. Deliberately NOT `forge-dictate`: that crate carries the speech
# models, which this shell has no use for and Android cannot build.
forge-capture = { path = "../../crates/forge-capture" }
# The browser's wire shapes: a gesture, a frame, the viewer state. Pure data,
# shared with the server that produces them.
forge-primitives = { path = "../../crates/forge-primitives" }

# Desktop-only: no plugin path exists for Android, where the APK updates
# through the system installer instead (a Kotlin side of its own).
[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"

# **The desktop overlay.** The server owns the browser; this half draws its
# frames in a native view over the takeover's page area (see `browser::cef`),
# which is AppKit and CoreGraphics work.
[target.'cfg(target_os = "macos")'.dependencies]
# The takeover's frames arrive WebP-encoded from the server; the overlay
# decodes each one and paints it.
webp = { version = "0.3", default-features = false }
libc = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSArray",
    "NSData",
    "NSDate",
    "NSDictionary",
    "NSProcessInfo",
    "NSRunLoop",
    "NSString",
    "NSTimer",
    "NSValue",
    "NSURL",
] }
objc2-app-kit = { version = "0.3", features = [
    "NSAlert",
    "NSApplication",
    "NSBitmapImageRep",
    "NSEvent",
    "NSGraphics",
    "NSOpenPanel",
    "NSPanel",
    "NSPasteboard",
    "NSResponder",
    "NSRunningApplication",
    "NSSavePanel",
    "NSTrackingArea",
    "NSView",
    "NSWindow",
] }
objc2-core-foundation = { version = "0.3", features = ["CFData"] }
objc2-core-graphics = { version = "0.3", features = [
    "CGColorSpace",
    "CGDataProvider",
    "CGImage",
    "CGWindow",
] }
objc2-quartz-core = { version = "0.3", features = ["CALayer"] }
block2 = { version = "0.6", optional = true }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKSnapshotConfiguration", "block2"], optional = true }
objc2-avf-audio = { version = "0.3", features = [
    "AVAudioBuffer",
    "AVAudioEngine",
    "AVAudioFormat",
    "AVAudioNode",
    "AVAudioPlayerNode",
    "AVAudioTime",
    "AVAudioTypes",
    "block2",
] }

[dev-dependencies]
tempfile = "3"
# `tauri::test::mock_context`, for the main-thread overlay check's real app.
tauri = { version = "2", features = ["test"] }
# `start_paused`, for the microphone's hold under a clock the test drives.
tokio = { version = "1", features = ["test-util"] }
# The socket's tests speak to a stub forge over a real websocket.
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
