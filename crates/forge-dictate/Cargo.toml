[package]
name = "forge-dictate"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Dictation primitive: sound in, text out. Local speech-to-text with verified model fetch. Depends on no other forge crate."
publish = false

[lints]
workspace = true

[dependencies]
# `blocking` on top of the workspace feature set: this crate's API is
# synchronous by design, so it must not require a caller's runtime.
reqwest = { workspace = true, features = ["blocking"] }
sha2 = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
dirs = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
