[package]
name = "forge-dictate"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Dictation primitive: sound in, text out. Local speech-to-text with verified model fetch. Depends on no other forge crate."
publish = false

[lints]
workspace = true

[dependencies]
# `blocking` on top of the workspace feature set: this crate's API is
# synchronous by design, so it must not require a caller's runtime. The
# converse is a hazard, not a guarantee: a blocking client must not run
# ON a runtime either, so an async caller uses spawn_blocking. See the
# crate docs.
reqwest = { workspace = true, features = ["blocking"] }
sha2 = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
dirs = { workspace = true }
# Shared ggml: llama-cpp-2 links its own static ggml, and two static
# copies collide on Linux (`duplicate symbol: ggml_backend_*`).
transcribe-cpp = { workspace = true, features = ["shared"] }
llama-cpp-2 = { workspace = true }
encoding_rs = { workspace = true }
# Per-take diagnostics: the take's capture written back as a canonical
# 16-bit PCM wav, and its metadata as JSON.
hound = { workspace = true }
serde_json = { workspace = true }
# The prompt normaliser's option types cross the wire inside the
# workspace's command and update enums, so they derive the codec here.
serde = { workspace = true }
# The fetched-at stamp on a fetched catalogue, in the RFC 3339 the rest
# of the wire's timestamps use.
time = { workspace = true }
# Microphone capture: the device, the input plan and the resampler. Its own
# crate because a client's shell opens the same device and must not carry
# this crate's models to do it.
forge-capture = { workspace = true }
# The seat a take belongs to. The workspace used to hand this in; the host
# trait below means the module names its own seat type, so the leaf gains
# the primitives crate and stays a leaf in every other direction. See the
# crate's `depends_on_no_forge_crate_but_a_leaf` test and the project's
# `CLAUDE.md` for the exception's reason.
forge-primitives = { workspace = true }
# The host seam's live-take lifecycle: the stop channels and the meters
# the runner awaits on. The crate's own synchronous API stays as it is;
# this is the async half a host drives.
tokio = { workspace = true }
# The runtime state's mutex, matching the rest of the workspace's choice.
parking_lot = { workspace = true }
# `[dictate]` settings deserialize from the same TOML the workspace's
# config does, and the device override stays an opaque `toml::Value`.
toml = { workspace = true }

# Metal is the only backend worth naming: elsewhere ggml selects one
# itself and falls back to CPU.
[target.'cfg(target_os = "macos")'.dependencies]
transcribe-cpp = { workspace = true, features = ["metal"] }
llama-cpp-2 = { workspace = true, features = ["metal"] }

[dev-dependencies]
tempfile = { workspace = true }
# `test-util` enables `#[tokio::test(start_paused = true)]`: the cap-tick
# test races the interval's first tick against a queued stop, and only a
# paused clock puts both arms ready on the first poll.
tokio = { workspace = true, features = ["test-util"] }
