[package]
name = "forge-dictate"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Dictation primitive: sound in, text out. Local speech-to-text with verified model fetch. Depends on no other forge crate."
publish = false

[lints]
workspace = true

[dependencies]
# `blocking` on top of the workspace feature set: this crate's API is
# synchronous by design, so it must not require a caller's runtime. The
# converse is a hazard, not a guarantee: a blocking client must not run
# ON a runtime either, so an async caller uses spawn_blocking. See the
# crate docs.
reqwest = { workspace = true, features = ["blocking"] }
sha2 = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
dirs = { workspace = true }
# Speech recognition. `metal` is the Apple-Silicon backend; the crate
# also offers cuda/vulkan/rocm for other hosts.
transcribe-cpp = { version = "0.2.2", features = ["metal"] }
# Microphone capture. The stream is !Send, which is why it lives on a
# thread of its own rather than inside `Capture`.
cpal = "0.18"

[dev-dependencies]
tempfile = { workspace = true }
serde_json = { workspace = true }
