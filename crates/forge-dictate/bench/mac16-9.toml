# forge-dictate bench. Regenerated by `just bench`. Commit the result.
# Do not hand-edit: an unreadable file makes the next run refuse rather
# than silently start the trend over.
#
# Measured on a WORKING machine, not a quiesced one - other jobs were
# running. That is the condition this pipeline runs under, so a
# comparison against a quiet-machine run is not like for like.
#
# The model sha256s sit beside the timings on purpose: if they are
# unchanged and a stage moved, it was our code.

[machine]
model = "Mac16,9"
cpu = "Apple M4 Max"
os = "macOS 26.5.2"

[corpus]
clips = 15
audio_seconds = 156
manifest_sha256 = "6145940f"

[asr]
model = "cohere-transcribe-03-2026-Q4_K_M.gguf"
sha256 = "0ea56826"

[normalizer]
model = "s1-mini-f16.gguf"
sha256 = "0370da4f"

# Speed. MEASURED and reproducible. Each figure is held to its
# resolution in ms: a new measurement within that many of the committed
# value leaves this file untouched, so a diff here is a real move.
#
# What that costs, so nobody reads more into a green file than is there:
#
#   decode is the noisiest stage (636-820 ms across runs), so its 300 ms
#   bucket hides anything short of a ~44% regression. That is the
#   measurement's limit, not the bucket's - a tighter one would churn
#   rather than resolve.
#
#   resample and mel have 10 ms buckets against 16-19 ms and 11-14 ms
#   values. So mel can reach 22 ms before this file moves. Their buckets
#   exceed their SPREADS by 3.3x where every other figure sits at
#   1.6-1.9x, which is affordable only because the two together are
#   under 1% of a run.
#
#   model_load is NOT here. It is bimodal - about 450 ms warm and 6977 ms
#   cold - so no bucket both survives a scheduled run and detects
#   anything. pipeline below subtracts it.
#
#   pipeline is NOT a fully load-free figure. The engine times model_load
#   around the ASR weights only; the normalizer's comparable 1.5 GB loads
#   after that timer stops and is still inside this number. How that cost
#   distributes is unmeasured, so do not read pipeline as pure compute.

[speed.resample]
ms = 18
resolution = 10

[speed.mel]
ms = 12
resolution = 10

[speed.encode]
ms = 1525
resolution = 100

[speed.decode]
ms = 682
resolution = 300

[speed.normalize]
ms = 1007
resolution = 150

[speed.pipeline]
ms = 3579
resolution = 500

# Accuracy. DIRECTIONAL, never a score.
#
# Per-clip identity is the signal: a percentage would hide which clip
# moved, and the baselines are another model's locked output rather
# than ground truth, so a difference is a question and not a verdict.
# Divergence is expected - see fixtures/README.md. Nothing here may be
# tuned toward these baselines.
#
# This is the WHOLE pipeline against baseline_normalized. The
# normalizer-only comparison, with both texts printed verbatim, is
# `cargo nextest run -p forge-dictate --test normalizer_baselines
# --run-ignored all --no-capture`.

[accuracy]
"01_003s.wav" = "matches"
"02_004s.wav" = "matches"
"03_005s.wav" = "differs"
"04_005s.wav" = "differs"
"05_006s.wav" = "differs"
"06_006s.wav" = "differs"
"07_007s.wav" = "differs"
"08_009s.wav" = "matches"
"09_012s.wav" = "matches"
"10_013s.wav" = "differs"
"11_013s.wav" = "matches"
"12_014s.wav" = "differs"
"13_015s.wav" = "matches"
"14_016s.wav" = "differs"
"15_020s.wav" = "matches"

# The ASR half, against baseline_asr. Committed separately because a
# whole-pipeline result cannot say WHERE a difference arose, and an ASR
# change the normalizer happens to absorb would otherwise produce no
# diff at all.

[accuracy_asr]
"01_003s.wav" = "matches"
"02_004s.wav" = "differs"
"03_005s.wav" = "differs"
"04_005s.wav" = "matches"
"05_006s.wav" = "matches"
"06_006s.wav" = "differs"
"07_007s.wav" = "differs"
"08_009s.wav" = "matches"
"09_012s.wav" = "matches"
"10_013s.wav" = "differs"
"11_013s.wav" = "matches"
"12_014s.wav" = "differs"
"13_015s.wav" = "matches"
"14_016s.wav" = "differs"
"15_020s.wav" = "matches"

# Recorded reference, NOT run by this bench and not like for like.
#
# Source: .plans/forge-dictate-implementation.md line 49, which records
# Superwhisper's MLX at 63.2x realtime. That note does not say who measured
# it, on what machine, or against what corpus, so the citation stops at
# "the research notes record it as measured".
#
# Deliberately not placed beside our figures and deliberately without a
# ratio: two numbers in adjacent rows imply a like-for-like run that never
# happened.

[reference]
superwhisper_realtime_factor = 63.2
