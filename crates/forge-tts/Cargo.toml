[package]
name = "forge-tts"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Speech synthesis: text in, audio chunks out. Local text-to-speech with verified model files. Depends on no other forge crate."
publish = false

# Deliberately not `[lints] workspace = true`: the workspace forbids unsafe,
# and this crate is where forge calls llama.cpp's audio-generation C ABI,
# which the safe binding does not wrap. Everything else matches the
# workspace table.
[lints.rust]
unsafe_code = "deny"
dead_code = "deny"
unused_imports = "deny"
unused_must_use = "deny"
unused_variables = "deny"
missing_docs = "allow"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
exit = "deny"
todo = "deny"
unimplemented = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
too_many_lines = "allow"
unnecessary_wraps = "allow"
struct_field_names = "allow"
struct_excessive_bools = "allow"
assert_is_empty = "allow"
print_stdout = "allow"
print_stderr = "allow"
# The FFI layer's signatures carry the pointers the C ABI takes.
not_unsafe_ptr_arg_deref = "allow"
# The PCM conversion clamps to [-1, 1] before scaling to i16, so both casts
# are bounded by the line above them.
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
# The C API hands the PCM buffer back as `char *`; it is a float buffer.
cast_ptr_alignment = "allow"

[dependencies]
# The TTS pipeline lives in libmtmd's C API, which the safe binding does not
# wrap; `metal` is opted into per-target below.
llama-cpp-sys-2 = { version = "0.1.160", default-features = false, features = ["mtmd"] }
# The bench's result crosses the wire to the models page.
serde = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-sys-2 = { version = "0.1.160", default-features = false, features = ["metal", "mtmd"] }

[dev-dependencies]
# The leaf-invariant guard reads cargo's own metadata.
serde_json = { workspace = true }
