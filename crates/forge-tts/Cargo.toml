[package]
name = "forge-tts"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Speech synthesis: text in, audio chunks out. Local text-to-speech with verified model files. Depends on no other forge crate."
publish = false

[lints.rust]
unsafe_code = "deny"
dead_code = "deny"
unused_imports = "deny"
unused_must_use = "deny"
unused_variables = "deny"
missing_docs = "allow"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
exit = "deny"
todo = "deny"
unimplemented = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
too_many_lines = "allow"
unnecessary_wraps = "allow"
struct_field_names = "allow"
struct_excessive_bools = "allow"
assert_is_empty = "allow"
print_stdout = "allow"
print_stderr = "allow"
# The PCM conversion clamps to [-1, 1] before scaling to i16, so both casts
# are bounded by the line above them.
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
# The resampler's sample positions and lengths are audio counts, far inside
# f64's exact integer range.
cast_precision_loss = "allow"

[dependencies]
# The Kokoro-82M inference path. It brings ONNX Runtime and the Misaki G2P
# with its bundled espeak-ng.
kokoro-en = { workspace = true }
# kokoro-en declares ort with a caret range that resolves past the API it was
# written against; this pin keeps the resolved RC one it compiles on.
ort = { workspace = true }
# The bench samples the process's resident set while it runs.
sysinfo = { workspace = true }
# The bench's result crosses the wire to the models page.
serde = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
# The model files are verified against the digests their entries declare.
sha2 = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
# The leaf-invariant guard reads cargo's own metadata.
serde_json = { workspace = true }
tempfile = { workspace = true }
