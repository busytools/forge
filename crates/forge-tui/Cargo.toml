[package]
name = "forge-tui"
version = "0.12.2"
edition = "2024"
rust-version = "1.88.0"
license.workspace = true
repository.workspace = true
description = "Native Rust terminal interface for the claude CLI"
keywords = ["cli", "tui", "claude", "ai", "terminal"]
categories = ["command-line-interface"]
default-run = "forge"

[lib]
name = "forge_tui"
path = "src/lib.rs"

[[bin]]
name = "forge"
path = "src/main.rs"

[dependencies]
# Workspace-shared deps. Versions + features come from the workspace
# unless overridden here.
forge-primitives = { workspace = true }
forge-agent = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
clap = { workspace = true }
crossterm = { workspace = true, features = ["event-stream"] }
ansi-to-tui = { workspace = true }
ignore = { workspace = true }
notify = { workspace = true }
notify-rust = { workspace = true }
pulldown-cmark = { workspace = true }
ratatui = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
similar = { workspace = true }
syntect = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true, features = ["json"] }
unicode-segmentation = { workspace = true }
unicode-width = { workspace = true }
uuid = { workspace = true }

# TUI-only deps not in the workspace yet.
arboard = { version = "3.6.1", features = ["image-data"] }
base64 = "0.22"
dirs = "6.0.0"
futures = "0.3.31"
image = { version = "0.25", default-features = false, features = ["png"] }
tokio-util = { version = "0.7.18", features = ["compat"] }
tui-markdown = { version = "0.3.7" }
tui-textarea-2 = "0.10.2"
which = "8.0.2"

[features]
perf = []

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }

[lints.clippy]
# Deny panic-prone operations in production code (tests exempted via clippy.toml)
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# CLI tools legitimately print to stdout/stderr
print_stdout = "allow"
print_stderr = "allow"

# Pedantic with noisy exceptions disabled
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# Lint categories
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }

# CLI-specific
exit = "deny"
shadow_same = "warn"
shadow_unrelated = "allow"
str_to_string = "warn"
