[package]
name = "forge-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Native Rust terminal interface for the claude CLI"
keywords = ["cli", "tui", "claude", "ai", "terminal"]
categories = ["command-line-interface"]
default-run = "forge"

[lib]
name = "forge_tui"
path = "src/lib.rs"

[[bin]]
name = "forge"
path = "src/main.rs"

[dependencies]
# Workspace-shared deps. Versions + features come from the workspace
# unless overridden here.
forge-primitives = { workspace = true }
forge-workspace = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
crossterm = { workspace = true, features = ["event-stream"] }
ansi-to-tui = { workspace = true }
notify-rust = { workspace = true }
pulldown-cmark = { workspace = true }
ratatui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
similar = { workspace = true }
syntect = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true, features = ["json"] }
unicode-segmentation = { workspace = true }
unicode-width = { workspace = true }
uuid = { workspace = true }

# TUI-only deps.
arboard = { workspace = true }
base64 = { workspace = true }
dirs = { workspace = true }
futures = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }
# Startup-time RLIMIT_NOFILE bump (#251). macOS launchd hands us a
# soft cap of 256 which multi-session forge runs through; the `rlimit`
# crate wraps `setrlimit` without needing an `unsafe` block (workspace
# forbids `unsafe_code`).
rlimit = { workspace = true }
tui-markdown = { workspace = true }
tui-textarea = { workspace = true }

[features]
perf = []
# Cross-crate test helpers. Exposes the per-`App` test-capture fields
# (`test_dispatched_{permission,question}_outcomes`) plus the
# `try_take_dispatched_*` getters so integration tests in this crate's
# `tests/` directory (separate compilation unit; `#[cfg(test)]` items
# aren't visible across that boundary) can assert "the user-pick
# handler fired outcome X for tool_id Y" without spinning up a real
# workspace. Enabled by this crate's own `[dev-dependencies]` self-ref
# so unit + integration tests both see the same gated surface.
testing = ["forge-workspace/testing"]

[dev-dependencies]
forge-sdk = { workspace = true }
forge-tui = { path = ".", features = ["testing"] }
forge-workspace = { workspace = true, features = ["test-helpers", "testing"] }
insta = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
