[package]
name = "forge-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The web view: HTTP served beside the TUI, from the process that owns the sessions"

[dependencies]
forge-primitives = { workspace = true }
# The view surface, and the only crate under it this one may name. Reads
# of the core and of a working tree both come from here: the git plumbing
# arrives re-exported, so nothing here reaches past the view layer.
forge-sessions = { workspace = true }
axum = { workspace = true }
futures-util = { workspace = true }
maud = { workspace = true }
tokio = { workspace = true, features = ["net"] }
tracing = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
reqwest = { workspace = true }
# The stream tests build wire frames the way the workspace's own tests do:
# from the JSON the CLI sends, not from a hand-filled struct.
serde_json = { workspace = true }
tempfile = { workspace = true }
# The view fixtures the page's own tests drive a real fleet through.
forge-sessions = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["full", "test-util"] }

[lints]
workspace = true
