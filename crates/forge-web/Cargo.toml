[package]
name = "forge-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The web view: HTTP served beside the TUI, from the process that owns the sessions"

[dependencies]
forge-primitives = { workspace = true }
# The git plumbing every read of a working tree goes through, rather than
# a second spawn of `git` here: `env::git_command` scrubs the ambient
# `GIT_DIR` / `GIT_WORK_TREE` that would answer about a foreign repo.
forge-agent = { workspace = true }
axum = { workspace = true }
maud = { workspace = true }
tokio = { workspace = true, features = ["net"] }
tracing = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
reqwest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }

[lints]
workspace = true
