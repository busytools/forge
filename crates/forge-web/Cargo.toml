[package]
name = "forge-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The web view: HTTP served beside the TUI, from the process that owns the sessions"

[dependencies]
forge-primitives = { workspace = true }
# The git plumbing every read of a working tree goes through, rather than
# a second spawn of `git` here: `env::git_command` scrubs the ambient
# `GIT_DIR` / `GIT_WORK_TREE` that would answer about a foreign repo.
forge-agent = { workspace = true }
# The view surface, which is the only way this crate reads the core. It
# never names `forge-workspace`: reads go through `forge-sessions` or they
# do not happen.
forge-sessions = { workspace = true }
axum = { workspace = true }
futures-util = { workspace = true }
maud = { workspace = true }
tokio = { workspace = true, features = ["net"] }
tracing = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
reqwest = { workspace = true }
# The stream tests build wire frames the way the workspace's own tests do:
# from the JSON the CLI sends, not from a hand-filled struct.
serde_json = { workspace = true }
tempfile = { workspace = true }
# The view fixtures the page's own tests drive a real fleet through.
forge-sessions = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["full", "test-util"] }

[lints]
workspace = true
