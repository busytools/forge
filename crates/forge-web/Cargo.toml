[package]
name = "forge-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The web view: HTTP served beside the TUI, from the process that owns the sessions"

[dependencies]
forge-primitives = { workspace = true }
# The view surface, and the only crate under it this one may name. Reads
# of the core and of a working tree both come from here: the git plumbing
# arrives re-exported, so nothing here reaches past the view layer.
forge-server = { workspace = true }
axum = { workspace = true }
futures-util = { workspace = true }
maud = { workspace = true }
# The assistant's prose is markdown, and a session's own words are the one
# place a page renders text it did not compose.
pulldown-cmark = { workspace = true }
# A source file a call read or wrote is drawn highlighted, into the four
# token classes the mockup names.
syntect = { workspace = true }
# The composer reads a tool call's own input to say what a prompt is about,
# an MCP server's config blob names the scope a server with none reads, and
# the status frame's own shape is worth reading for the one field that says a
# compaction is running.
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net"] }
tracing = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
reqwest = { workspace = true }
tempfile = { workspace = true }
# The view fixtures the page's own tests drive a real fleet through.
forge-server = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["full", "test-util"] }

[lints]
workspace = true
