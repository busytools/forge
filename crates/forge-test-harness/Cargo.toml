[package]
name = "forge-test-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Wire-conformance harness for forge-sdk against the claude CLI. Replay-based CI plus opt-in live capture."
publish = false

[lints]
workspace = true

[dependencies]
forge-primitives = { workspace = true }
forge-sdk = { path = "../forge-sdk", version = "=1.1.3" }
tokio = { workspace = true }
serde_json.workspace = true
regex.workspace = true
parking_lot.workspace = true

[dev-dependencies]
async-trait.workspace = true
# `socket_replay` samples a hand-off's own fields, whose id is a uuid.
uuid.workspace = true
# `socket_replay` names the enums that cross the socket - `ServerMessage`,
# `Subject`, `Command`, `SessionUpdate` - and the protocol version its
# records are filed under. Dev-only for the same reason as the dependency
# below: a test that reads the server's wire is not part of the harness's
# production surface.
forge-server = { workspace = true }
# Workers MCP scenario tests need the in-process MCP server impl plus
# its mock facade, both of which live in forge-workspace gated behind
# the `testing` feature flag. Dev-only dep so the harness's production
# surface (forge-sdk + forge-primitives) stays minimal.
forge-workspace = { workspace = true, features = ["testing", "test-helpers"] }
# `socket_replay` samples the models read, whose snapshot carries the
# dictate crate's own facts and bench metrics. Dev-only for the same
# reason as the deps above.
forge-dictate = { workspace = true }
# `sdk_scenarios_worktree_spawn` needs a fresh git repo per run to give
# `--worktree` something to fork off. Dev-only because it's a test fixture
# concern.
tempfile.workspace = true
