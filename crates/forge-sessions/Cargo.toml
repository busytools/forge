[package]
name = "forge-sessions"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "What a view needs and nothing about how it renders."
publish = false

[lints]
workspace = true

[dependencies]
forge-primitives = { workspace = true }
forge-workspace = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
# The surface's equivalence tests read the same workspace the TUI reads,
# so they need `Workspace::testing_stub`, its seeding helpers, and the
# `forge.toml` fixture `Workspace::new_for_test` builds from a tempdir.
forge-workspace = { workspace = true, features = ["testing", "test-helpers"] }
tempfile = { workspace = true }
