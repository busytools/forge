[package]
name = "forge-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Drives a forge-sdk Client; runs callback runtime; manages session lifecycle. The brain between forge-sdk and forge-tui."
publish = false

[lints]
workspace = true

[features]
# Test fixture helpers (`Agent::testing_stub`, `ForgeSdkBridge`'s
# Default impl). Production builds never see this code; sibling
# crates that need stub agents in their integration tests must
# enable this feature via their own [dev-dependencies] entry.
testing = []

[dependencies]
forge-primitives = { workspace = true }
forge-providers = { workspace = true }
forge-sdk = { path = "../forge-sdk", version = "=1.0.42" }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["full"] }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
hex = { workspace = true }
ignore = { workspace = true }
notify = { workspace = true }
parking_lot = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
time = { workspace = true }
time-tz = { workspace = true }
iana-time-zone = { workspace = true }
unicode-normalization = { workspace = true }
uuid = { workspace = true }
which = { workspace = true }
sysinfo = { workspace = true }
httpdate = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
