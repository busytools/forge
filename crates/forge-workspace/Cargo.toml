[package]
name = "forge-workspace"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Multi-session orchestration: pools forge-agent Agents behind a forge.toml-driven workspace surface."
publish = false

[lints]
workspace = true

[features]
# Cross-crate test helpers. Exposes constructors on `ProjectView`,
# `SessionView`, and `ProjectKey` so integration tests in sibling
# crates' `tests/` directories (e.g. `forge-tui`) can build view
# fixtures without spinning up a real on-disk catalog. Forwards to
# the same feature on `forge-primitives` for `SessionKey::from_str_for_test`.
test-helpers = ["forge-primitives/test-helpers"]
# Test fixture helpers (`Workspace::testing_stub`,
# `Workspace::test_default`). Replaces forge-tui's prior
# `forge_agent::Agent::testing_stub` so the TUI's unit + integration
# tests can construct a fully-wired `Workspace` without a real
# `forge.toml`. Forwards to `forge-agent/testing` so the stub
# `Agent::testing_stub()` factory is visible cross-crate.
# Production builds never see this code.
testing = ["forge-agent/testing"]

[dependencies]
forge-primitives = { workspace = true }
forge-agent = { workspace = true }
forge-sdk = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
time = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
dirs = { workspace = true }
uuid = { workspace = true }
rustix = { workspace = true }
croner = { workspace = true }
chrono = { workspace = true }
redb = { workspace = true }

[dev-dependencies]
forge-agent = { workspace = true, features = ["testing"] }
# `test-helpers` exposes `SessionKey::from_str_for_test` cross-crate;
# without this dev-dep override the workspace's own lib tests fail to
# compile because they reach the feature-gated constructor from
# `forge_primitives::SessionKey`. Mirroring the same hop the testing
# feature does for forge-agent.
forge-primitives = { workspace = true, features = ["test-helpers"] }
# `test-util` enables `#[tokio::test(start_paused = true)]` +
# `tokio::time::{advance, pause}`. Required by the kick-dispatcher
# stagger tests (#259) - without paused-time control they'd race the
# real-time `KICK_DISPATCH_INTERVAL` sleep.
tokio = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }
