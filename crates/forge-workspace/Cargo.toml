[package]
name = "forge-workspace"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Multi-session orchestration: pools forge-agent Agents behind a forge.toml-driven workspace surface."
publish = false

[lints]
workspace = true

[features]
# Cross-crate test helpers. Exposes constructors on `ProjectView`,
# `SessionView`, and `ProjectKey` so integration tests in sibling
# crates' `tests/` directories (e.g. `forge-tui`) can build view
# fixtures without spinning up a real on-disk catalog.
test-helpers = []

[dependencies]
forge-primitives = { workspace = true }
forge-agent = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
dirs = { workspace = true }
tempfile = { workspace = true }
time = { workspace = true }
