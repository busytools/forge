[package]
name = "forge-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "The server: what a client reads of the core, and no view of its own."
publish = false

[features]
# View fixtures for a sibling crate's `tests/`: a `ViewSurface` over a
# stub workspace with a seeded roster, so a view test drives a real page
# without its own manifest naming `forge-workspace`. Production builds
# never see this code.
testing = ["dep:tempfile", "forge-workspace/testing", "forge-workspace/test-helpers"]

# The measurement harness: a server over a fixture fleet, plus the client that
# prices a request against it. It needs `testing` for the fleet, so it is
# skipped rather than failed on a build that has that feature off - and no
# production build has it on.
[[bin]]
name = "forge-fold-cost"
path = "src/bin/forge-fold-cost.rs"
required-features = ["testing"]

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
# The socket. The pin and its other two features come from the workspace,
# so `ws` is added here rather than the shared pin being moved.
axum = { workspace = true, features = ["ws"] }
# A document's bytes cross the socket base64: the wire is JSON, and a byte
# array would serialise as a number per byte.
base64 = { workspace = true }
# The protocol client's own arguments. A BIN cannot see dev-dependencies, so
# a binary crate's arguments are a real dependency or they are hand-parsed.
clap = { workspace = true }
# `--generate-completion`'s script generator, called by `scripts/install.sh`
# against the binary this crate now ships.
clap_complete = { workspace = true }
# The boot's config-dir resolution (`$HOME/.claude` fallback) and the
# diagnostics path beside it.
dirs = { workspace = true }
forge-primitives = { workspace = true }
# The binary's first act, before logging resolves the app-support tree:
# the legacy-name migration (forge_sdk::paths::migrate_legacy_app_support).
forge-sdk = { workspace = true }
forge-workspace = { workspace = true }
# A socket's incoming messages are a `futures_util::Stream`.
futures-util = { workspace = true }
# The protocol client is a BIN, and a bin cannot see dev-dependencies - so
# the crate's own client for the socket has to be a real dependency. It costs
# the lock nothing: axum's `ws` already pulls tungstenite underneath it.
tokio-tungstenite = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# The subscription verb hands out the workspace's own receiver, and naming
# that type is a tokio channel. `net` is the listener the socket binds:
# the workspace's own set does not carry it, and without it
# `tokio::net::TcpListener` reads as a missing item rather than a missing
# feature. `signal` is the headless binary's own Ctrl-C park.
tokio = { workspace = true, features = ["sync", "net", "signal"] }
# The Monitor tail read reports a file it could not open, which is a
# diagnosis a reader makes from the log rather than from the page.
tracing = { workspace = true }
# The diagnostics runtime the binary boots: a rotated JSON file beside the
# state store, the same one the terminal has always written.
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true, features = ["json"] }
# The FD soft-limit raise (#251), which belongs to the binary rather than
# to any view.
rlimit = { workspace = true }
# The fleet fixture's own directory, which the fixture holds and removes
# with itself. Gated with `testing`, so no production build links it.
tempfile = { workspace = true, optional = true }

[dev-dependencies]
# This crate's own tests drive the fleet fixture `testing` gates, so a
# scoped `cargo nextest run -p forge-server` (no --all-features) compiles
# them the way a workspace build already does.
forge-server = { path = ".", features = ["testing"] }
# The surface's equivalence tests read the same workspace the TUI reads,
# so they need `Workspace::testing_stub`, its seeding helpers, and the
# `forge.toml` fixture `Workspace::new_for_test` builds from a tempdir.
forge-workspace = { workspace = true, features = ["testing", "test-helpers"] }
# A session's dictation overrides are this crate's to carry, and their axes
# are `forge-dictate`'s types, so the test that they arrive populated names
# them here rather than asserting a shape without a value.
# The socket's frame intake is tested against an engine that registers
# takes without weights, which is the dictation crate's test-only
# constructor.
forge-dictate = { workspace = true, features = ["test-helpers"] }
# The connectors fixture seeds durable subscriptions, which are keyed by id.
uuid = { workspace = true }
# A test reads back the records a site emitted, which needs a subscriber to
# catch them with.
tracing-subscriber = { workspace = true }
