# Workspace-wide clippy configuration.

# A binary workspace with no published crates, so breaking an exported
# item is not a concern the lint needs to guard.
avoid-breaking-exported-api = false

# Toolchain pin (matches workspace.package.rust-version).
msrv = "1.88.0"

# Tests can use these freely; production code is gated via [workspace.lints].
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-print-in-tests = true
allow-dbg-in-tests = true
allow-indexing-slicing-in-tests = true

# CLI tools deal with deep path nesting (e.g., ~/.config/forge/...).
absolute-paths-max-segments = 3

# Bumped from default 7 to cover recursion fns with state threaded as
# flat params.
# Workspace-internal; no public API impact.
# `build_options_with_callback` is back to 9 args after its per-account
# inputs (config_dir/env) were bundled into `AccountBinding`.
too-many-arguments-threshold = 10

# Short identifiers common in CLI arg parsing, loops, and channel names.
allowed-idents-below-min-chars = ["i", "j", "k", "x", "y", "z", "n", "s", "c", "op", "tx", "rx", "id", "ip", "os", "ex"]
