[profile.default]
# A wedged worker would otherwise run to the CI job timeout with no
# attribution. Sized for the CI-reachable suite, which finishes far
# inside it. The weights-backed tests behind `--run-ignored all` load
# 3 GB and decode repeatedly, so they run closer to the limit.
slow-timeout = { period = "30s", terminate-after = 4 }

# nextest's window for a finished test's stdout/stderr to close before marking
# it leaky; widened from the 200ms default so a process that closes a few
# seconds later is not annotated.
leak-timeout = "10s"

# Live capture runs against the real CLI, whose shutdown after stdin
# close now lingers past a minute (2.1.263), so a single capture can
# legitimately outlast the default ceiling. Run with `-P capture`.
[profile.capture]
slow-timeout = { period = "60s", terminate-after = 8 }

# These two print what they actually pinned, and that number IS the point of
# them: it is how a reader learns the record is weaker than it looks before
# something breaks rather than after. nextest captures a passing test's
# output, so without this the denominator appears only on the runs where
# something is already wrong, which is the half that does not need it.
[[profile.default.overrides]]
filter = 'test(the_committed_socket_contract_is_still_what_the_server_emits) or test(every_subject_round_trips_through_its_fixture)'
success-output = "immediate"

# **The headless server tests run real child processes**, and every wait in
# them is bounded: derived from the SDK's own budgets (65 s for a spawn, 15 s
# for a stop and its exit) or a 100 s wedge over a delivery that ends the wait
# when it lands. The largest stack is `a_stop_signal_takes_the_sessions_
# descendants_with_it`, which runs its scenario once per signal:
#   2 x (100 listening + 65 marker + 15 stop + 15 gone) = 390 s.
# The next largest are `a_termination_sent_straight_at_the_child_marks_it`
# (100 + 65 + 65 + 5 + 15 = 250 s), `one_stop_takes_two_sessions_down`
# (100 + 65 + 65 + 15 + 15 = 280 s) and `headless_boot_serves_the_home_and_
# stops_clean` (100 + 3 walk + 15 + 100 + 15 = 233 s). The default 30 s x 4
# kill (120 s) would take every one of them on a merely slow machine, so this
# override puts the kill at 100 s x 5 = 500 s: 110 s above the largest real
# stack, and still a named stop rather than a job timeout.
[[profile.default.overrides]]
filter = 'binary(headless_server)'
slow-timeout = { period = "100s", terminate-after = 5 }

# **This test can hold two full watch passes**, each a scan of ten budgeted
# `git` children: the pass whose mark it waits on, and the driven pass that
# moves the values. Its own wedge for one pass is `POKE_INTERVAL +
# SCAN_WORST_CASE` = 101 s, so the whole test can legitimately run to 202 s on
# a loaded machine. The default 30 s x 4 kill (120 s) would take it there, so
# this override puts the kill at 3 x 101 s = 303 s - above the 202 s the test
# itself allows, and still a named stop rather than a job timeout. The test's
# own message is the red before either bound.
[[profile.default.overrides]]
filter = 'test(an_open_announces_no_value_its_snapshot_carried)'
slow-timeout = { period = "101s", terminate-after = 3 }

# **The CEF live tests boot real browser hosts**, each a Chromium of its own,
# and the host's ready check allows fifteen seconds from its own start. Two
# at a time starved the macOS CI runner once the suite reached 165 tests
# (measured 2026-10-24: `reap_live`'s identity check failed one run and
# `download_live`'s announcement the next), so one host boots at a time; the
# rest of the suite still runs in parallel. The filter is every test binary
# that boots a host, so a new one joins this list in the change that adds it.
[test-groups]
cef-live = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'binary(veto_live) or binary(input_live) or binary(frame_roundtrip) or binary(record_live) or binary(audio_live) or binary(download_live) or binary(file_live) or binary(click_live) or binary(host_bundle) or binary(reap_live) or binary(tabs_live) or binary(popup_live) or binary(browser_service) or binary(browser_custom_live) or binary(surface_parity_live) or binary(autofill_live) or binary(webauthn_live) or binary(host_log_live)'
test-group = 'cef-live'
