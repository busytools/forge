[profile.default]
# A wedged worker would otherwise run to the CI job timeout with no
# attribution. Sized for the CI-reachable suite, which finishes far
# inside it. The weights-backed tests behind `--run-ignored all` load
# 3 GB and decode repeatedly, so they run closer to the limit.
slow-timeout = { period = "30s", terminate-after = 4 }

# nextest's window for a finished test's stdout/stderr to close before marking
# it leaky; widened from the 200ms default so a process that closes a few
# seconds later is not annotated.
leak-timeout = "10s"

# Live capture runs against the real CLI, whose shutdown after stdin
# close now lingers past a minute (2.1.263), so a single capture can
# legitimately outlast the default ceiling. Run with `-P capture`.
[profile.capture]
slow-timeout = { period = "60s", terminate-after = 8 }

# These two print what they actually pinned, and that number IS the point of
# them: it is how a reader learns the record is weaker than it looks before
# something breaks rather than after. nextest captures a passing test's
# output, so without this the denominator appears only on the runs where
# something is already wrong, which is the half that does not need it.
[[profile.default.overrides]]
filter = 'test(the_committed_socket_contract_is_still_what_the_server_emits) or test(every_subject_round_trips_through_its_fixture)'
success-output = "immediate"

# **The CEF live tests boot real browser hosts**, each a Chromium of its own,
# and the host's ready check allows fifteen seconds from its own start. Two
# at a time starved the macOS CI runner once the suite reached 165 tests
# (measured 2026-10-24: `reap_live`'s identity check failed one run and
# `download_live`'s announcement the next), so one host boots at a time; the
# rest of the suite still runs in parallel. The filter is every test binary
# that boots a host, so a new one joins this list in the change that adds it.
[test-groups]
cef-live = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'binary(veto_live) or binary(input_live) or binary(frame_roundtrip) or binary(record_live) or binary(audio_live) or binary(download_live) or binary(file_live) or binary(click_live) or binary(host_bundle) or binary(reap_live) or binary(tabs_live) or binary(browser_service) or binary(browser_custom_live) or binary(surface_parity_live)'
test-group = 'cef-live'
